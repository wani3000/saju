name: Research validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      recompute_ephemeris:
        description: Recompute all JPL roots with the pinned kernel and Python dependencies
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.17.0'
      - name: Install pinned package manager
        run: npm install --global pnpm@11.25.0
      - name: Restore pinned research engines
        run: node research/validation/restore-engines.mjs
      - name: Install validation dependencies
        run: pnpm --dir research/validation install --frozen-lockfile --ignore-scripts
      - name: Check documentation
        run: python3 tools/check_docs.py
      - name: Build verified engine sources
        run: node research/validation/build.mjs
      - name: Verify independent NAOJ fixtures offline
        run: |
          python3 research/validation/collect-naoj.py --check
          python3 research/validation/collect-naoj-sensitivity.py
          python3 research/validation/collect-naoj-sensitivity.py --thresholds
      - name: Verify pinned KASI monthly source rows offline
        run: python3 research/validation/collect-kasi-months.py --check
      - name: Validate research adapter
        run: pnpm --dir research/validation test
      - name: Reproduce release-readiness evidence (not an approval)
        run: node research/validation/audit-release-readiness.mjs --check
      - name: Set up Python for independent recomputation
        if: github.event_name == 'workflow_dispatch' && inputs.recompute_ephemeris
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Recompute independent JPL roots on request
        if: github.event_name == 'workflow_dispatch' && inputs.recompute_ephemeris
        run: |
          python3 -m venv /tmp/saju-ephemeris
          /tmp/saju-ephemeris/bin/pip install -r research/validation/requirements-ephemeris.txt
          /tmp/saju-ephemeris/bin/python research/validation/collect-ephemeris.py --download --check
